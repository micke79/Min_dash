<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Örebro & Kumla Dashboard</title>

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --danger: #dc2626;
      --warning: #f59e0b;
      --success: #16a34a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f9fafb;
        --muted: #9ca3af;
        --border: #374151;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 22px;
      margin: 0;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .status-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 17px;
      font-weight: 700;
    }

    .updated {
      font-size: 11px;
      color: var(--muted);
    }

    /* Väder */

    .current-weather {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .weather-icon {
      font-size: 48px;
    }

    .temperature {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
    }

    .weather-description {
      color: var(--muted);
      margin-top: 5px;
    }

    .weather-details {
      text-align: right;
      font-size: 13px;
      line-height: 1.8;
    }

    .forecast {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(65px, 1fr);
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .forecast-item {
      text-align: center;
      padding: 9px 5px;
      border-radius: 12px;
      background: rgba(127, 127, 127, 0.08);
      min-width: 65px;
    }

    .forecast-time {
      font-size: 11px;
      color: var(--muted);
    }

    .forecast-icon {
      font-size: 22px;
      margin: 7px 0;
    }

    .forecast-temp {
      font-weight: 700;
      font-size: 14px;
    }

    .rain {
      font-size: 11px;
      color: #2563eb;
      margin-top: 5px;
    }

    .storm {
      font-size: 11px;
      color: #7c3aed;
      margin-top: 3px;
      font-weight: 700;
    }

    /* Händelser */

    .event {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .event:last-child {
      border-bottom: 0;
    }

    .event-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: rgba(220, 38, 38, 0.1);
    }

    .event-title {
      font-weight: 700;
      font-size: 14px;
    }

    .event-location {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .event-time {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .event-type {
      display: inline-block;
      font-size: 10px;
      border-radius: 999px;
      padding: 3px 7px;
      margin-top: 5px;
      background: rgba(127, 127, 127, 0.12);
    }

    /* Kris */

    .alert {
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 4px solid var(--warning);
      background: rgba(245, 158, 11, 0.08);
    }

    .alert:last-child {
      margin-bottom: 0;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .alert-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .no-alert {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 13px;
      border-radius: 14px;
      background: rgba(22, 163, 74, 0.08);
      color: var(--success);
      font-weight: 600;
    }

    .source {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
    }

    @media (min-width: 700px) {
      .app {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <h1>📍 Örebro & Kumla</h1>
      <p>Min dashboard</p>
    </div>

    <div>
      <strong id="clock">--:--</strong>
    </div>
  </header>


  <!-- STATUS -->

  <div class="status">

    <div class="status-pill">
      🌦️ Kumla
    </div>

    <div class="status-pill">
      🚨 <span id="eventCount">2</span> händelser
    </div>

    <div class="status-pill">
      🆘 Inga VMA
    </div>

  </div>


  <!-- VÄDER -->
